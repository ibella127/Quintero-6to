<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krono | Web Oficial</title>
    <link rel="icon" type="image/x-icon" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Ícono de Profesores: dos imágenes (clara/oscura) superpuestas que se
           cruzan según el modo — evita que se vean las dos pisadas juntas */
        .nav-icon-profes-wrap { position: relative; display: block; }
        .nav-icon-profes-img {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: contain; transition: opacity 0.3s ease;
        }
        .nav-icon-profes-img.icon-oscuro { opacity: 0; }
        body.dark-mode .nav-icon-profes-img.icon-claro { opacity: 0; }
        body.dark-mode .nav-icon-profes-img.icon-oscuro { opacity: 1; }
    </style>
    <script>
        // Iguala el tamaño del ícono de Profesores (dos <img> apiladas) al de
        // los demás íconos del nav, midiendo el real en vez de adivinar un px.
        function igualarTamanoIconoProfes() {
            var wrap = document.querySelector('.nav-icon-profes-wrap');
            var otro = document.querySelector('.nav-item img:not(.nav-icon-profes-img)');
            if (!wrap || !otro) return;
            var w = otro.getBoundingClientRect().width;
            var h = otro.getBoundingClientRect().height;
            if (w && h) {
                wrap.style.width  = w + 'px';
                wrap.style.height = h + 'px';
            }
        }
        document.addEventListener('DOMContentLoaded', igualarTamanoIconoProfes);
        window.addEventListener('load', igualarTamanoIconoProfes);
        window.addEventListener('resize', igualarTamanoIconoProfes);
    </script>
</head>
<body>
    <div class="bg-blur"></div>

    <div class="layout">

        <header class="sidebar">
            <div class="logo-top">
                <img src="logo-lateral.png" alt="Logo KRONO" class="side-img">
            </div>
            <!-- Botón hamburguesa: solo se muestra en pantallas chicas (ver style.css) -->
            <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="nav-principal">
                <span></span><span></span><span></span>
            </button>
            <nav class="nav-icons" id="nav-principal" aria-label="Menú principal">
                <a href="alumno.html" class="nav-item">
                    <img src="icono-alumno.png" alt="Estudiantes">
                    <span class="nav-label">Estudiantes</span>
                </a>
                <a href="preceptoria.html" class="nav-item">
                    <img src="icono-prece.png" alt="Preceptoría">
                    <span class="nav-label">Preceptoría</span>
                </a>
                <a href="directivos.html" class="nav-item">
                    <img src="icono-directivos.png" alt="Directivos" class="nav-icon-dir-img">
                    <span class="nav-label">Directivos</span>
                </a>
                <a href="profesores.html" class="nav-item">
                    <span class="nav-icon-profes-wrap">
                        <img src="Icono-profes.png" alt="Profesores" class="nav-icon-profes-img icon-claro">
                        <img src="Icono-profes-blanco.png" alt="Profesores" class="nav-icon-profes-img icon-oscuro">
                    </span>
                    <span class="nav-label">Profesores</span>
                </a>
            </nav>
        </header>

        <main class="main-content">

            <section class="hero-section">

                <!-- Líneas animadas de acento -->
                <div class="hero-lines" aria-hidden="true">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

                <!-- Puntos decorativos pulsantes de fondo -->
                <div class="hero-dots" aria-hidden="true">
                    <span></span><span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span><span></span>
                </div>

                <div class="hero-container">
                    <div class="main-title-img">
                        <img src="titulo-krono-imagen.png" alt="KRONO" class="krono-header">
                    </div>

                    <div class="flip-card">
                        <div class="flip-card-inner">
                            <div class="flip-card-front">
                                <p>Es una APP que te ayudará a llevar un conteo de tus faltas para mejorar tu rendimiento y ayudar al prece con su trabajo... ¡y te brinda premios en cantina!</p>
                            </div>
                            <div class="flip-card-back">
                                <img src="imagen-escuela.png" alt="Mi Escuela" class="school-img">
                            </div>
                        </div>
                    </div>

                    <p class="footer-msg">Deslizá hacia abajo para dejarnos tu consulta</p>
                </div>
            </section>

            <section id="contacto" class="contact-section">
                <div class="form-container">
                    <h2 class="section-title">¿Tenés alguna duda? <span>Escribinos</span></h2>

                    <form id="contactForm" action="https://formspree.io/f/mgopoaoa" method="POST" class="krono-form">
                        <div class="form-row">
                            <input type="text" name="nombre" id="nombre" placeholder="Nombre completo" required>
                            <input type="email" name="email" id="email" placeholder="Gmail" required>
                        </div>
                        <textarea name="consulta" id="consulta" placeholder="Escribí tu consulta aquí..." required></textarea>
                        <button type="submit" class="btn-enviar">Enviar Consulta</button>
                    </form>
                </div>
            </section>

        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
